# Publishes the site to GitHub Pages on every push to the default branch.
# The configure-pages step turns Pages on for the repository the first time it
# runs, so there is nothing to click in Settings.
name: Deploy to GitHub Pages

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    # Only the default branch gets published; other branches just build nothing.
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          # Switches Pages on (build type "GitHub Actions") if it isn't already.
          enablement: true

      # The site is plain HTML/CSS/JS, so the repo root is uploaded as-is.
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
